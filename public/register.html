<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/login.css">
  <link rel="shortcut icon" href="/assets/images/logo.png" type="image/x-icon">
  <title>SyncRad | Register</title>
</head>
<body>
  <div class="container">
    <div class="login-form">
      <img src="./assets/images/logo.png" alt="logo">
      <input type="text" name="fullname" id="fullname" placeholder="نام کامل">
      <input type="tel" name="phone-number" id="phone-number" placeholder="09---------">
      <input type="text" name="username" id="username" placeholder="نام کاربری">
      <input type="password" name="password" id="password" placeholder="کلمه عبور">
      <br>
      <button class="btn btn-red" id="register">ثبت نام</button>
      <p class="error"></p>
      <p>
        حساب کاربری دارید؟
        <a href="/login">ورود به حساب کاربری</a>
      </p>
    </div>
  </div>
  <script src="/assets/js/login.js" async defer></script>
</body>
</html>
